<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Synapse Neural Recall Interface</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #040711;
      --panel-bg: rgba(8, 14, 28, 0.78);
      --border-cyan: #00f0ff;
      --glow-cyan: rgba(0, 240, 255, 0.28);
      --neon-lime: #00ff88;
      --glow-lime: rgba(0, 255, 136, 0.25);
      --neon-magenta: #ff0055;
      --glow-magenta: rgba(255, 0, 85, 0.3);
      --neon-amber: #ffaa00;
      --glow-amber: rgba(255, 170, 0, 0.3);
      --text-main: #e0f2fe;
      --text-dim: #64748b;
      --font-display: 'Chakra Petch', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-mono);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Matrix Grid & Scanline Effect */
    .grid-matrix {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
      z-index: -2;
      pointer-events: none;
    }
    body::before {
      content: " ";
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 255, 0, 0.03));
      z-index: 999;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      opacity: 0.7;
    }

    .container {
      width: 100%;
      max-width: 890px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 1;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      border: 1px solid var(--border-cyan);
      box-shadow: 0 0 16px var(--glow-cyan), inset 0 0 16px rgba(0, 240, 255, 0.05);
      border-radius: 8px;
      padding: 16px 20px;
      position: relative;
    }
    .header-info h1 {
      font-family: var(--font-display);
      font-size: 1.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 10px var(--glow-cyan);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-info p {
      color: var(--text-dim);
      font-size: 0.8rem;
      margin-top: 2px;
    }
    .user-profile-hud {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar-wrapper {
      position: relative;
      width: 52px;
      height: 52px;
    }
    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--border-cyan);
      box-shadow: 0 0 12px var(--glow-cyan);
    }
    .status-ring {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 10px;
      height: 10px;
      background: var(--neon-lime);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--neon-lime);
      border: 2px solid var(--bg);
    }

    /* Telemetry HUD Grid */
    .telemetry-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .hud-cell {
      background: var(--panel-bg);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 6px;
      padding: 10px 14px;
      text-align: center;
      position: relative;
    }
    .hud-cell::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 4px; height: 100%;
      background: var(--border-cyan);
    }
    .hud-val {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 10px var(--glow-cyan);
    }
    .hud-lbl {
      font-size: 0.68rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    /* Progress Track */
    .stream-bar-wrapper {
      background: var(--panel-bg);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 6px;
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .stream-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-dim);
    }
    .stream-track {
      width: 100%;
      height: 6px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid rgba(0, 240, 255, 0.15);
    }
    .stream-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--border-cyan), var(--neon-lime));
      box-shadow: 0 0 10px var(--glow-cyan);
      transition: width 0.3s ease;
    }

    /* Controls Panel */
    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .terminal-select {
      background: var(--panel-bg);
      border: 1px solid rgba(0, 240, 255, 0.25);
      color: var(--border-cyan);
      font-family: var(--font-mono);
      padding: 10px 14px;
      border-radius: 6px;
      outline: none;
      font-size: 0.82rem;
      cursor: pointer;
      width: 100%;
    }
    .terminal-select:focus {
      border-color: var(--border-cyan);
      box-shadow: 0 0 12px var(--glow-cyan);
    }

    .tabs {
      display: flex;
      gap: 8px;
    }
    .tab-btn {
      flex: 1;
      background: var(--panel-bg);
      border: 1px solid rgba(0, 240, 255, 0.2);
      color: var(--text-dim);
      padding: 10px 6px;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      border-color: var(--border-cyan);
      color: #fff;
    }
    .tab-btn.active {
      background: rgba(0, 240, 255, 0.12);
      border-color: var(--border-cyan);
      color: #fff;
      box-shadow: 0 0 12px var(--glow-cyan);
    }
    .badge {
      background: var(--neon-magenta);
      color: #fff;
      font-size: 0.65rem;
      font-family: var(--font-mono);
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      margin-left: 4px;
      box-shadow: 0 0 8px var(--glow-magenta);
    }

    /* Core Card */
    .view-card {
      background: var(--panel-bg);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 8px;
      padding: 24px;
      min-height: 450px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 240, 255, 0.03);
    }
    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      font-size: 0.78rem;
    }
    .terminal-tag {
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid var(--border-cyan);
      color: var(--border-cyan);
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .question-title {
      font-family: var(--font-display);
      font-size: 1.25rem;
      line-height: 1.5;
      font-weight: 600;
      color: #fff;
      margin-bottom: 20px;
    }

    /* Multiple Choice */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }
    .opt-btn {
      text-align: left;
      background: rgba(4, 7, 17, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.15);
      color: var(--text-main);
      padding: 14px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      transition: all 0.2s;
    }
    .opt-btn:hover:not(:disabled) {
      border-color: var(--border-cyan);
      background: rgba(0, 240, 255, 0.05);
      transform: translateX(4px);
    }
    .opt-btn.correct {
      background: rgba(0, 255, 136, 0.15) !important;
      border-color: var(--neon-lime) !important;
      color: var(--neon-lime) !important;
      box-shadow: 0 0 14px var(--glow-lime) !important;
    }
    .opt-btn.wrong {
      background: rgba(255, 0, 85, 0.15) !important;
      border-color: var(--neon-magenta) !important;
      color: #fda4af !important;
      box-shadow: 0 0 14px var(--glow-magenta) !important;
    }

    /* Identification Input */
    .id-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 18px;
    }
    .terminal-input {
      width: 100%;
      background: rgba(4, 7, 17, 0.9);
      border: 1px solid rgba(0, 240, 255, 0.25);
      color: #fff;
      padding: 14px 16px;
      border-radius: 6px;
      font-size: 1rem;
      font-family: var(--font-mono);
      outline: none;
      transition: all 0.2s;
    }
    .terminal-input:focus {
      border-color: var(--border-cyan);
      box-shadow: 0 0 14px var(--glow-cyan);
    }
    .terminal-input.correct {
      border-color: var(--neon-lime) !important;
      background: rgba(0, 255, 136, 0.1) !important;
      box-shadow: 0 0 14px var(--glow-lime) !important;
    }
    .terminal-input.wrong {
      border-color: var(--neon-magenta) !important;
      background: rgba(255, 0, 85, 0.1) !important;
      box-shadow: 0 0 14px var(--glow-magenta) !important;
    }

    /* Flashcards */
    .flip-container {
      perspective: 1000px;
      width: 100%;
      height: 250px;
      cursor: pointer;
      margin-bottom: 18px;
    }
    .flip-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.5s;
      transform-style: preserve-3d;
    }
    .flip-inner.flipped { transform: rotateY(180deg); }
    .flip-front, .flip-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      border-radius: 6px;
      background: rgba(4, 7, 17, 0.9);
      border: 1px solid rgba(0, 240, 255, 0.2);
    }
    .flip-back {
      transform: rotateY(180deg);
      border-color: var(--border-cyan);
    }
    .flip-hint {
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-top: 14px;
      letter-spacing: 1px;
    }

    /* Feedback Banner with Rationale Box */
    .feedback {
      padding: 14px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 0.88rem;
      line-height: 1.5;
      display: none;
    }
    .feedback.show { display: block; }
    .feedback.correct {
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid var(--neon-lime);
      color: var(--neon-lime);
    }
    .feedback.wrong {
      background: rgba(255, 0, 85, 0.1);
      border: 1px solid var(--neon-magenta);
      color: #fda4af;
    }
    .rationale-box {
      margin-top: 10px;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 4px;
      border-left: 3px solid var(--neon-amber);
      font-size: 0.84rem;
      color: #cbd5e1;
      line-height: 1.5;
    }
    .rationale-box strong { color: var(--neon-amber); display: block; margin-bottom: 4px; }

    /* Action Controls & REDO Section */
    .actions-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-top: 1px solid rgba(0, 240, 255, 0.15);
      padding-top: 16px;
    }
    .action-group-left, .action-group-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      padding: 11px 18px;
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: 1px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      text-transform: uppercase;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary { 
      background: var(--border-cyan); 
      color: #040711; 
      box-shadow: 0 0 14px var(--glow-cyan);
    }
    .btn-primary:hover:not(:disabled) { 
      background: #38bdf8;
      box-shadow: 0 0 20px var(--glow-cyan);
    }
    .btn-secondary { 
      background: rgba(255, 255, 255, 0.05); 
      color: var(--text-main);
      border: 1px solid rgba(0, 240, 255, 0.2);
    }
    .btn-secondary:hover:not(:disabled) { 
      background: rgba(0, 240, 255, 0.1); 
      border-color: var(--border-cyan);
    }
    /* Dedicated Redo Button Design */
    .btn-redo {
      background: rgba(255, 170, 0, 0.1);
      border: 1px solid var(--neon-amber);
      color: var(--neon-amber);
      box-shadow: 0 0 10px rgba(255, 170, 0, 0.2);
    }
    .btn-redo:hover:not(:disabled) {
      background: rgba(255, 170, 0, 0.2);
      box-shadow: 0 0 16px var(--glow-amber);
      transform: translateY(-1px);
    }
    .btn:disabled { 
      opacity: 0.3; 
      cursor: not-allowed; 
    }

    /* Vault Cards */
    .vault-card {
      background: rgba(4, 7, 17, 0.85);
      border: 1px solid rgba(255, 0, 85, 0.3);
      border-left: 4px solid var(--neon-magenta);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .vault-card h4 { font-size: 0.98rem; color: #fff; font-family: var(--font-display); }
    .vault-card p { font-size: 0.84rem; color: var(--text-dim); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="grid-matrix"></div>

<div class="container">
  <!-- System Header with Profile Integration -->
  <header>
    <div class="header-info">
      <h1><span style="color: var(--border-cyan);">SYNAPSE</span> // RECALL TERMINAL</h1>
      <p>System Status: Active | Protocols: SDG 3, 4, 5, 6, 7 Architecture</p>
    </div>
    <div class="user-profile-hud">
      <div class="avatar-wrapper">
        <img src="vi9maq.jpg" alt="Agent Icon" class="avatar-img" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=RecallNode'" />
        <div class="status-ring"></div>
      </div>
    </div>
  </header>

  <!-- Telemetry Dashboard -->
  <div class="telemetry-grid">
    <div class="hud-cell">
      <div class="hud-val" id="scoreVal">0</div>
      <div class="hud-lbl">Sync Score</div>
    </div>
    <div class="hud-cell">
      <div class="hud-val" id="accuracyVal">0%</div>
      <div class="hud-lbl">Accuracy Index</div>
    </div>
    <div class="hud-cell">
      <div class="hud-val" id="streakVal">0 🔥</div>
      <div class="hud-lbl">Neural Streak</div>
    </div>
    <div class="hud-cell">
      <div class="hud-val" id="levelVal">Tier 1</div>
      <div class="hud-lbl">Authorization</div>
    </div>
  </div>

  <!-- Telemetry Progress Bar -->
  <div class="stream-bar-wrapper">
    <div class="stream-info">
      <span id="deckProgressText">INDEX: 01 / 30</span>
      <span id="xpText">0 / 100 CALIBER</span>
    </div>
    <div class="stream-track">
      <div class="stream-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- Controls Panel -->
  <div class="controls-panel">
    <select id="topicFilter" class="terminal-select" onchange="applyFilters()">
      <option value="all">EXECUTE: ALL DATA BANKS (90 CONCEPTS)</option>
      <option value="t4">MODULE 04: HEALTH, SANITATION & WELL-BEING (30 CONCEPTS)</option>
      <option value="t5">MODULE 05: EDUCATION, GENDER & CAPABILITY (30 CONCEPTS)</option>
      <option value="t6">MODULE 06: ENERGY, INFRASTRUCTURE & SYSTEMS (30 CONCEPTS)</option>
    </select>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchMode('mcq')">Multiple Choice</button>
      <button class="tab-btn" onclick="switchMode('identification')">Identification</button>
      <button class="tab-btn" onclick="switchMode('flashcard')">Flashcards</button>
      <button class="tab-btn" onclick="switchMode('vault')">
        Review Topics <span id="vaultBadge" class="badge">0</span>
      </button>
    </div>
  </div>

  <!-- Main Active Recall Display -->
  <div id="deckView" class="view-card">
    <div>
      <div class="meta-bar">
        <span class="terminal-tag" id="tagCategory">MODULE 04</span>
        <span id="cardCountLabel" style="color: var(--border-cyan); font-weight:700;">01 / 30</span>
      </div>

      <div id="questionContainer">
        <!-- Injected Dynamically -->
      </div>

      <div id="feedbackBox" class="feedback"></div>
    </div>

    <!-- Actions Footer with Dedicated REDO Section -->
    <div class="actions-footer" id="actionsFooter">
      <!-- Buttons Injected Dynamically -->
    </div>
  </div>

  <!-- Diagnostic Mistake Vault -->
  <div id="vaultView" class="view-card hidden">
    <div>
      <div class="meta-bar">
        <span style="font-family: var(--font-display); color: #fff; letter-spacing: 1px;">DIAGNOSTIC ERROR LOG & REVIEWS</span>
        <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.72rem;" onclick="clearVault()">Purge Log</button>
      </div>
      <div id="vaultList" style="max-height: 460px; overflow-y: auto; padding-right: 6px;">
        <!-- Injected dynamically -->
      </div>
    </div>
    <div class="actions-footer">
      <button class="btn btn-primary" onclick="drillVaultItems()">Drill Logged Errors</button>
    </div>
  </div>
</div>

<script>
  // Complete Dataset from Topics 4, 5, and 6 with Explicit "Why It Is True" Proofs
  const allCurriculum = [
    // --- TOPIC 4: Health, Well-being, Water, Sanitation (1 to 30) ---
    {
      id: "t4-1", topic: "t4", topicName: "Topic 4: Health Across Life Course",
      title: "Life-Course Health",
      question: "Which SDG seeks to ensure healthy lives and promote well-being for all at all ages across the entire life course?",
      answer: "SDG 3",
      aliases: ["sdg 3", "sdg3", "goal 3"],
      options: ["SDG 1", "SDG 3", "SDG 5", "SDG 11"],
      explanation: "SDG 3 recognizes health as a continuing human-development concern extending from pregnancy through old age.",
      whyTrue: "The 2030 Agenda explicitly designates Goal 3 as 'Ensure healthy lives and promote well-being for all at all ages,' distinguishing it from goals that focus strictly on specific demographics like children or workers."
    },
    {
      id: "t4-2", topic: "t4", topicName: "Topic 4: Maternal Health",
      title: "Maternal Mortality Target",
      question: "What is the global target ratio for maternal mortality per 100,000 live births by 2030 under Target 3.1?",
      answer: "Fewer than 70",
      aliases: ["70", "fewer than 70", "less than 70", "<70"],
      options: ["Fewer than 50", "Fewer than 70", "Fewer than 100", "Fewer than 140"],
      explanation: "Target 3.1 aims to reduce maternal mortality to less than 70 per 100,000 live births, tracked by skilled childbirth attendance.",
      whyTrue: "The official UN 2030 indicator 3.1.1 benchmark specifies reducing the maternal mortality ratio to fewer than 70 deaths per 100,000 live births globally, verified through skilled health personnel attendance."
    },
    {
      id: "t4-3", topic: "t4", topicName: "Topic 4: Child Survival",
      title: "Neonatal & Under-5 Mortality",
      question: "Which target establishes mortality objectives of 12 per 1,000 for neonatal and 25 per 1,000 for under-5 children by 2030?",
      answer: "Target 3.2",
      aliases: ["target 3.2", "3.2"],
      options: ["Target 3.1", "Target 3.2", "Target 3.8", "Target 6.1"],
      explanation: "Target 3.2 aims to end preventable newborn and under-5 child deaths globally.",
      whyTrue: "Target 3.2 uniquely defines child survival by setting exact statistical thresholds: neonatal mortality at or below 12 per 1,000 live births and under-5 mortality at or below 25 per 1,000 live births."
    },
    {
      id: "t4-4", topic: "t4", topicName: "Topic 4: Communicable Diseases",
      title: "Ending Major Epidemics",
      question: "Which target aims to end epidemics of AIDS, tuberculosis, malaria, and neglected tropical diseases (NTDs)?",
      answer: "Target 3.3",
      aliases: ["target 3.3", "3.3"],
      options: ["Target 3.3", "Target 3.5", "Target 3.7", "Target 3.b"],
      explanation: "Target 3.3 addresses major communicable epidemics alongside hepatitis and water-borne illnesses.",
      whyTrue: "Target 3.3 directly combines infectious disease eradication strategies, monitoring annual incidence rates for HIV, TB, malaria, hepatitis B, and NTDs."
    },
    {
      id: "t4-5", topic: "t4", topicName: "Topic 4: Non-Communicable Diseases",
      title: "NCD Mortality Reduction",
      question: "By what proportion does Target 3.4 seek to reduce premature mortality from major non-communicable diseases by 2030?",
      answer: "One-third",
      aliases: ["one-third", "1/3", "one third", "33%"],
      options: ["One-half", "One-third", "One-fourth", "Two-thirds"],
      explanation: "Target 3.4 addresses cardiovascular diseases, cancer, diabetes, and chronic respiratory diseases through prevention and treatment.",
      whyTrue: "The treaty language under Target 3.4 specifies achieving a 'one-third reduction' in premature mortality from the four major NCD groups (cardiovascular, cancer, diabetes, chronic respiratory diseases)."

      whyTrue: "A development trade-off occurs when advancing one goal generates negative friction with another—such as clearing biodiverse forests (SDG 15) to build agricultural farms (SDG 2)—demanding balanced policy design."
    },
    {
      id: "t6-28", topic: "t6", topicName: "Topic 6: National Planning Integration",
      title: "Mainstreaming into National Frameworks",
      question: "The 2019 SDG Summit urged nations to mainstream the 2030 Agenda directly into what domestic instruments?",
      answer: "National development plans and financial frameworks",
      aliases: ["national development plans", "national plans", "national planning instruments", "budgets"],
      options: ["Military budgets", "National development plans and financial frameworks", "Tourist marketing brochures", "Corporate charter filings"],

      whyTrue: "International declarations lack domestic enforcement until parliaments embed them into binding statutory development plans, fiscal appropriations, and local municipal zoning laws."
    },
    {
      id: "t6-29", topic: "t6", topicName: "Topic 6: Participation & Ownership",
      title: "National Sustainable Development Strategies (NSDS)",
      question: "Under Agenda 21, National Sustainable Development Strategies (NSDS) must be developed through what kind of participation?",
      answer: "Widest possible participation",
      aliases: ["widest possible participation", "broad participation", "public participation"],
      options: ["Closed executive sessions", "Widest possible participation", "Corporate-only review", "Foreign consultant oversight"],
      explanation: "NSDS demands democratic civil society participation, local stakeholder ownership, and thorough contextual analysis.",
      whyTrue: "Agenda 21 Paragraph 8.7 mandates that national strategies must emerge from the 'widest possible participation' of civil society, indigenous groups, and local businesses to create shared ownership."
    },
    {
      id: "t6-30", topic: "t6", topicName: "Topic 6: Integrated Resource System",
      title: "Human and Natural System Synthesis",
      question: "Ultimately, sustainable development treats energy, water, transit, health, and gender equality as parts of what single unified entity?",
      answer: "An integrated resource and human system",
      aliases: ["integrated system", "integrated resource and human system", "unified system", "system"],
      options: ["Independent competitive markets", "An integrated resource and human system", "Sovereign national jurisdictions", "Technocratic engineering puzzles"],
      explanation: "Human well-being, planetary ecosystems, and resource infrastructures form one continuous, interconnected global system.",
      whyTrue: "Ecological and socio-economic science proves that humans do not live outside nature; society, governance, resource supplies, and ecosystems form an interconnected global system."
    }
  ];

  // Engine State
  let currentTopic = "all";
  let currentMode = "mcq";
  let activeList = [];
  let currentIndex = 0;
  let score = 0;
  let totalAttempts = 0;
  let streak = 0;
  let xp = 0;
  let userMistakes = [];
  let hasEvaluatedCurrent = false;

  // Sound Engine
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function playSynth(freq, type, duration, vol = 0.08) {
    try {
      if (!audioCtx) audioCtx = new AudioCtx();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  function playSuccessPulse() {
    playSynth(880, 'sine', 0.08, 0.07);
    setTimeout(() => playSynth(1320, 'sine', 0.15, 0.08), 50);
  }

  function playGlitchError() {
    playSynth(150, 'sawtooth', 0.15, 0.09);
    setTimeout(() => playSynth(110, 'sawtooth', 0.2, 0.08), 80);
  }

  function playResetTone() {
    playSynth(440, 'triangle', 0.1, 0.06);
    setTimeout(() => playSynth(330, 'triangle', 0.15, 0.05), 60);
  }

  function initApp() {
    applyFilters();
    setupKeyListeners();
  }

  function setupKeyListeners() {
    window.addEventListener('keydown', (e) => {
      if (currentMode === "vault") return;

      if (currentMode === "mcq") {
        if (!hasEvaluatedCurrent && ['1','2','3','4'].includes(e.key)) {
          const idx = parseInt(e.key) - 1;
          const btns = document.querySelectorAll('.opt-btn');
          if (btns[idx]) btns[idx].click();
        } else if (hasEvaluatedCurrent && e.key === 'Enter') {
          nextCard();
        }
      }
    });
  }

  function applyFilters() {
    currentTopic = document.getElementById('topicFilter').value;
    if (currentTopic === "all") {
      activeList = [...allCurriculum];
    } else {
      activeList = allCurriculum.filter(item => item.topic === currentTopic);
    }
    activeList.sort(() => Math.random() - 0.5);
    currentIndex = 0;
    loadCard();
  }

  function switchMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    if (mode === "vault") {
      document.getElementById('deckView').classList.add('hidden');
      document.getElementById('vaultView').classList.remove('hidden');
      renderVault();
      return;
    }

    document.getElementById('deckView').classList.remove('hidden');
    document.getElementById('vaultView').classList.add('hidden');
    loadCard();
  }

  function loadCard() {
    hasEvaluatedCurrent = false;
    const container = document.getElementById('questionContainer');
    const footer = document.getElementById('actionsFooter');
    const feedback = document.getElementById('feedbackBox');
    feedback.className = "feedback";
    feedback.innerHTML = "";

    if (activeList.length === 0) {
      container.innerHTML = `<p style="text-align:center; padding: 40px 0; color: var(--text-dim);">No active telemetry stream located.</p>`;
      footer.innerHTML = "";
      return;
    }

    const item = activeList[currentIndex];
    document.getElementById('tagCategory').textContent = item.topicName.toUpperCase();
    document.getElementById('cardCountLabel').textContent = `${String(currentIndex + 1).padStart(2, '0')} / ${String(activeList.length).padStart(2, '0')}`;
    document.getElementById('deckProgressText').textContent = `INDEX: ${String(currentIndex + 1).padStart(2, '0')} / ${String(activeList.length).padStart(2, '0')}`;

    if (currentMode === "mcq") {
      const opts = [...item.options].sort(() => Math.random() - 0.5);
      const optsHtml = opts.map((opt, i) => `
        <button class="opt-btn" onclick="submitMcq('${opt.replace(/'/g, "\\'")}', this)">
          <span style="color: var(--border-cyan); margin-right: 12px; font-weight:700;">[0${i+1}]</span> ${opt}
        </button>
      `).join('');

      container.innerHTML = `
        <h3 class="question-title">${item.question}</h3>
        <div class="options-grid">${optsHtml}</div>
      `;
      footer.innerHTML = `
        <div class="action-group-left">
          <button class="btn btn-secondary" onclick="prevCard()" ${currentIndex === 0 ? 'disabled' : ''}>[PREV]</button>
          <!-- Dedicated Redo Section Button -->
          <button class="btn btn-redo" onclick="redoCurrentCard()" title="Reset current card to re-attempt">⟲ REDO PROTOCOL</button>
        </div>
        <div class="action-group-right">
          <button class="btn btn-primary" id="nextBtn" onclick="nextCard()" disabled>NEXT NODE &gt;&gt;</button>
        </div>
      `;
    } 
    else if (currentMode === "identification") {
      container.innerHTML = `
        <h3 class="question-title">${item.question}</h3>
        <div class="id-form">
          <input type="text" id="idInput" class="terminal-input" placeholder="INPUT EXACT TELEMETRY IDENTIFIER..." autocomplete="off" />
        </div>
      `;
      footer.innerHTML = `
        <div class="action-group-left">
          <button class="btn btn-secondary" onclick="prevCard()" ${currentIndex === 0 ? 'disabled' : ''}>[PREV]</button>
          <!-- Dedicated Redo Section Button -->
          <button class="btn btn-redo" onclick="redoCurrentCard()" title="Reset current card to re-attempt">⟲ REDO PROTOCOL</button>
        </div>
        <div class="action-group-right">
          <button class="btn btn-primary" id="idActionBtn" onclick="handleIdAction()">EXECUTE CHECK (ENTER)</button>
        </div>
      `;

      setTimeout(() => {
        const input = document.getElementById('idInput');
        if (input) {
          input.focus();
          input.addEventListener('keydown', (ev) => {
            if (ev.key === 'Enter') handleIdAction();
          });
        }
      }, 50);
    } 
    else if (currentMode === "flashcard") {
      container.innerHTML = `
        <div class="flip-container" onclick="this.querySelector('.flip-inner').classList.toggle('flipped')">
          <div class="flip-inner">
            <div class="flip-front">
              <span class="terminal-tag" style="margin-bottom: 12px;">${item.title}</span>
              <h3 style="font-size: 1.15rem; line-height: 1.5; color:#fff;">${item.question}</h3>
              <p class="flip-hint">// CLICK TO DECRYPT CONCEPT //</p>
            </div>
            <div class="flip-back">
              <span class="terminal-tag" style="margin-bottom: 10px; border-color: var(--neon-lime); color: var(--neon-lime);">DECRYPTED PROTOCOL</span>
              <p style="font-size: 1.3rem; font-weight:700; color: #fff; margin-bottom: 8px;">${item.answer}</p>
              <p style="font-size: 0.85rem; color: #cbd5e1; line-height: 1.45; margin-bottom: 10px;">${item.explanation}</p>
              <div style="font-size: 0.78rem; color: var(--neon-amber); text-align: left; padding: 6px 10px; background: rgba(0,0,0,0.6); border-radius: 4px; border-left: 2px solid var(--neon-amber);">
                <strong>WHY THIS IS TRUE:</strong> ${item.whyTrue}
              </div>
              <p class="flip-hint">// CLICK TO RETURN //</p>
            </div>
          </div>
        </div>
      `;
      footer.innerHTML = `
        <div class="action-group-left">
          <button class="btn btn-secondary" onclick="prevCard()" ${currentIndex === 0 ? 'disabled' : ''}>[PREV]</button>
          <!-- Dedicated Redo Section Button -->
          <button class="btn btn-redo" onclick="redoCurrentCard()" title="Flip back and reset">⟲ FLIP / RESET</button>
        </div>
        <div class="action-group-right">
          <button class="btn btn-secondary" style="border-color: var(--neon-magenta); color: #fda4af;" onclick="rateFlashcard(false)">LOG FOR RETRY</button>
          <button class="btn btn-primary" style="background: var(--neon-lime); color: #040711;" onclick="rateFlashcard(true)">CONFIRMED</button>
        </div>
      `;
    }
  }

  // Dedicated Redo Logic
  function redoCurrentCard() {
    playResetTone();
    loadCard();
  }

  // Handle Multiple Choice
  function submitMcq(choice, btnEl) {
    if (hasEvaluatedCurrent) return;
    hasEvaluatedCurrent = true;
    totalAttempts++;

    const item = activeList[currentIndex];
    const isCorrect = (choice === item.answer);
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => {
      b.disabled = true;
      if (b.innerText.includes(item.answer)) b.classList.add('correct');
    });

    const feedback = document.getElementById('feedbackBox');
    if (isCorrect) {
      btnEl.classList.add('correct');
      handleSuccess();
      feedback.className = "feedback show correct";
      feedback.innerHTML = `
        <strong>// PROTOCOL VERIFIED //</strong> Correct answer: <strong>${item.answer}</strong>.
        <div class="rationale-box">
          <strong>WHY THIS ANSWER IS TRUE:</strong>
          ${item.whyTrue}
          <div style="margin-top: 6px; font-size: 0.78rem; color: #94a3b8;"><em>Context:</em> ${item.explanation}</div>
        </div>
      `;
    } else {
      btnEl.classList.add('wrong');
      handleMistake(item, choice);
      feedback.className = "feedback show wrong";
      feedback.innerHTML = `
        <strong>// SIGNAL DISCREPANCY //</strong> Valid protocol is: <strong>${item.answer}</strong>.
        <div class="rationale-box">
          <strong>WHY THIS ANSWER IS TRUE:</strong>
          ${item.whyTrue}
          <div style="margin-top: 6px; font-size: 0.78rem; color: #94a3b8;"><em>Context:</em> ${item.explanation}</div>
        </div>
      `;
    }
    const nextBtn = document.getElementById('nextBtn');
    nextBtn.disabled = false;
    nextBtn.focus();
  }

  // Handle Identification
  function handleIdAction() {
    const btn = document.getElementById('idActionBtn');
    const input = document.getElementById('idInput');

    if (hasEvaluatedCurrent) {
      nextCard();
      return;
    }

    const val = input.value.trim().toLowerCase();
    if (!val) {
      input.focus();
      return;
    }

    hasEvaluatedCurrent = true;
    input.disabled = true;
    totalAttempts++;

    const item = activeList[currentIndex];
    const isCorrect = item.aliases.some(alias => alias.toLowerCase() === val);
    const feedback = document.getElementById('feedbackBox');

    if (isCorrect) {
      input.classList.add('correct');
      handleSuccess();
      feedback.className = "feedback show correct";
      feedback.innerHTML = `
        <strong>// EXACT TELEMETRY MATCH //</strong> Protocol accepted: <strong>${item.answer}</strong>.
        <div class="rationale-box">
          <strong>WHY THIS ANSWER IS TRUE:</strong>
          ${item.whyTrue}
          <div style="margin-top: 6px; font-size: 0.78rem; color: #94a3b8;"><em>Context:</em> ${item.explanation}</div>
        </div>
      `;
    } else {
      input.classList.add('wrong');
      handleMistake(item, input.value.trim());
      feedback.className = "feedback show wrong";
      feedback.innerHTML = `
        <strong>// UNMATCHED TELEMETRY //</strong> Verified identifier is: <strong>${item.answer}</strong>.
        <div class="rationale-box">
          <strong>WHY THIS ANSWER IS TRUE:</strong>
          ${item.whyTrue}
          <div style="margin-top: 6px; font-size: 0.78rem; color: #94a3b8;"><em>Context:</em> ${item.explanation}</div>
        </div>
      `;
    }

    btn.textContent = "NEXT NODE >>";
    btn.focus();
  }

  // Flashcards Rating
  function rateFlashcard(knewIt) {
    totalAttempts++;
    const item = activeList[currentIndex];
    if (knewIt) {
      handleSuccess();
    } else {
      handleMistake(item, "Logged via Flashcard");
    }
    nextCard();
  }

  function handleSuccess() {
    score += 10;
    streak++;
    xp += 25;
    playSuccessPulse();
    updateTrackers();
  }

  function handleMistake(item, userResponse) {
    streak = 0;
    playGlitchError();
    updateTrackers();
    if (!userMistakes.some(m => m.id === item.id)) {
      userMistakes.push({ ...item, wrongInput: userResponse });
      updateVaultBadge();
    }
  }

  function updateTrackers() {
    document.getElementById('scoreVal').textContent = score;
    document.getElementById('streakVal').textContent = `${streak} 🔥`;

    const accuracy = totalAttempts > 0 ? Math.round((score / (totalAttempts * 10)) * 100) : 0;
    document.getElementById('accuracyVal').textContent = `${accuracy}%`;

    const level = Math.floor(xp / 100) + 1;
    const progressInLevel = xp % 100;
    document.getElementById('levelVal').textContent = `Tier ${level}`;
    document.getElementById('xpText').textContent = `${progressInLevel} / 100 CALIBER`;
    document.getElementById('progressFill').style.width = `${progressInLevel}%`;
  }

  function updateVaultBadge() {
    document.getElementById('vaultBadge').textContent = userMistakes.length;
  }

  function renderVault() {
    const list = document.getElementById('vaultList');
    if (userMistakes.length === 0) {
      list.innerHTML = `<p style="text-align: center; color: var(--text-dim); padding: 40px 0;">No anomaly logs recorded. Complete operational synchronization achieved.</p>`;
      return;
    }

    list.innerHTML = userMistakes.map(item => `
      <div class="vault-card">
        <div style="display:flex; justify-content:space-between;">
          <span class="terminal-tag" style="border-color: var(--neon-magenta); color: var(--neon-magenta);">${item.topicName}</span>
          <span style="font-size: 0.72rem; color: var(--text-dim);">${item.title}</span>
        </div>
        <h4>${item.question}</h4>
        <p>Your Input: <span style="color: var(--neon-magenta); font-weight:700;">${item.wrongInput}</span> | Target: <span style="color: var(--neon-lime); font-weight:700;">${item.answer}</span></p>
        <div class="rationale-box">
          <strong>WHY THIS ANSWER IS TRUE:</strong>
          ${item.whyTrue}
          <div style="margin-top: 4px; font-size: 0.78rem; color: #94a3b8;"><em>Context:</em> ${item.explanation}</div>
        </div>
      </div>
    `).join('');
  }

  function drillVaultItems() {
    if (userMistakes.length === 0) return;
    activeList = [...userMistakes].sort(() => Math.random() - 0.5);
    currentIndex = 0;
    currentMode = "mcq";
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector('.tab-btn').classList.add('active');
    document.getElementById('deckView').classList.remove('hidden');
    document.getElementById('vaultView').classList.add('hidden');
    loadCard();
  }

  function clearVault() {
    userMistakes = [];
    updateVaultBadge();
    renderVault();
  }

  function nextCard() {
    if (currentIndex < activeList.length - 1) {
      currentIndex++;
      loadCard();
    } else {
      alert("// RUN COMPLETE // End of data stream. Access Review Topics to drill anomalies.");
    }
  }

  function prevCard() {
    if (currentIndex > 0) {
      currentIndex--;
      loadCard();
    }
  }

  initApp();
</script>
